name: Generate daily draft

on:
  schedule:
    - cron: "0 3 * * *"   # 08:00 Pakistan time (UTC+5)
  workflow_dispatch:
    inputs:
      pillar:
        description: "Pillar (AI, Career, Tech, Startup, Code, Engagement, Mindset) — blank = today's"
        required: false
        default: ""
      replace:
        description: "Draft id to replace (used by the Regenerate button)"
        required: false
        default: ""
      idea:
        description: "Idea to write about (used when you message the bot)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: posting-agent-generate   # one draft at a time; state files never overlap with process.yml
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Latest state, not the commit from when this run was queued — otherwise a run queued
          # behind another one would miss its saved state (e.g. publish a draft a second time).
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Generate draft and send to Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_TOKEN_EXPIRES: ${{ secrets.LINKEDIN_TOKEN_EXPIRES }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_TOKEN_EXPIRES: ${{ secrets.THREADS_TOKEN_EXPIRES }}
          GH_PAT: ${{ secrets.GH_PAT }}   # optional: lets the agent renew the Threads token by itself
          PILLAR: ${{ inputs.pillar }}
          REPLACE: ${{ inputs.replace }}
          IDEA: ${{ inputs.idea }}
        run: python main.py generate --pillar "$PILLAR" --replace "$REPLACE" --idea "$IDEA"

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="💥 Draft generation failed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null

      - name: Save state
        if: always()
        run: |
          git config user.name "posting-agent"
          git config user.email "posting-agent@users.noreply.github.com"
          git add state
          git diff --cached --quiet && exit 0
          git commit -m "draft: $(date -u +%F)"
          for i in 1 2 3 4 5; do   # the other workflow may have pushed meanwhile
            git pull --rebase && git push && exit 0
            sleep $((i * 3))
          done
          exit 1
